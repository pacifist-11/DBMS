# ============================================================
# NexusVault Backend — Application Configuration
# ============================================================

# Server
server.port=8080

# ──────────────────────────────────────────────
# PostgreSQL DataSource
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/nexusvault
spring.datasource.username=postgres
spring.datasource.password=Irctc@11
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Prevent open-session-in-view anti-pattern
spring.jpa.open-in-view=false

# ──────────────────────────────────────────────
# Jackson / JSON Serialization
# ──────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ──────────────────────────────────────────────
# JWT Configuration
# ──────────────────────────────────────────────
# Secret must be >= 256 bits for HS256. Change this in production!
jwt.secret=NexusVault_SuperSecret_Key_2024_ChangeInProduction_MinimumLength256Bits
jwt.expiration-ms=86400000

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging.level.io.nexusvault=DEBUG
logging.level.org.springframework.security=DEBUG
